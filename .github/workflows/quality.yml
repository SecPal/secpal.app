---
name: Quality Checks

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  reuse:
    name: Check REUSE Compliance
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@86c921a638669c7c9e9995bee276cf672e126bef # main

  license-compatibility:
    name: Check License Compatibility
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-license-compatibility.yml@86c921a638669c7c9e9995bee276cf672e126bef # main

  prettier:
    name: Formatting Check
    uses: SecPal/.github/.github/workflows/reusable-prettier.yml@86c921a638669c7c9e9995bee276cf672e126bef # main
    with:
      node-version: "26.10.0"

  markdown-lint:
    name: Markdown Lint
    uses: SecPal/.github/.github/workflows/reusable-markdown-lint.yml@86c921a638669c7c9e9995bee276cf672e126bef # main
    with:
      governance-ref: "6f8e13a7a62cee356811a7f58d6b92119941652f"
      node-version: "26.10.0"

  ai-instructions:
    name: AI Instructions
    uses: SecPal/.github/.github/workflows/reusable-ai-instructions.yml@86c921a638669c7c9e9995bee276cf672e126bef # main
    with:
      node-version: "26.10.0"

  eslint:
    name: ESLint
    uses: SecPal/.github/.github/workflows/reusable-node-lint.yml@86c921a638669c7c9e9995bee276cf672e126bef # main
    with:
      node-version: "26.10.0"

  astro-check:
    name: Astro TypeScript Check
    uses: SecPal/.github/.github/workflows/reusable-node-build.yml@86c921a638669c7c9e9995bee276cf672e126bef # main
    with:
      node-version: "26.10.0"
      build-command: "npm run check"

  build:
    # Preserve the existing required check while admitting security before build.
    name: Astro Build / Build Project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Scan repository security
        id: repository-security
        # yamllint disable-line rule:line-length
        uses: SecPal/.github/.github/actions/trivy-repository-scan@86c921a638669c7c9e9995bee276cf672e126bef # main

      - name: Require clean repository security
        if: ${{ always() }}
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.repository-security.outcome }}
          GATE_STATE: ${{ steps.repository-security.outputs.gate-state }}
        run: |
          test "$SCAN_OUTCOME" = success
          test "$GATE_STATE" = CLEAN

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.10.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  test:
    name: Node Tests
    uses: SecPal/.github/.github/workflows/reusable-node-test.yml@86c921a638669c7c9e9995bee276cf672e126bef # main
    with:
      node-version: "26.10.0"
      test-command: "npm test"
