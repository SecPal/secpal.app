---
name: Quality Checks

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  reuse:
    name: Check REUSE Compliance
    uses: SecPal/.github/.github/workflows/reusable-reuse.yml@ce3a04a2cda9a704427010c0621383785b15652b

  license-compatibility:
    name: Check License Compatibility
    uses: SecPal/.github/.github/workflows/reusable-license-compatibility.yml@ce3a04a2cda9a704427010c0621383785b15652b

  prettier:
    name: Formatting Check
    uses: SecPal/.github/.github/workflows/reusable-prettier.yml@ce3a04a2cda9a704427010c0621383785b15652b

  markdown-lint:
    name: Markdown Lint
    uses: SecPal/.github/.github/workflows/reusable-markdown-lint.yml@ce3a04a2cda9a704427010c0621383785b15652b
    with:
      governance-ref: "6f8e13a7a62cee356811a7f58d6b92119941652f"

  ai-instructions:
    name: AI Instructions
    uses: SecPal/.github/.github/workflows/reusable-ai-instructions.yml@ce3a04a2cda9a704427010c0621383785b15652b
    with:
      governance-ref: "6f8e13a7a62cee356811a7f58d6b92119941652f"

  eslint:
    name: ESLint
    uses: SecPal/.github/.github/workflows/reusable-node-lint.yml@ce3a04a2cda9a704427010c0621383785b15652b
    with:
      node-version: "22"

  astro-check:
    name: Astro TypeScript Check
    uses: SecPal/.github/.github/workflows/reusable-node-build.yml@ce3a04a2cda9a704427010c0621383785b15652b
    with:
      node-version: "22"
      build-command: "npm run check"

  build:
    name: Astro Build
    uses: SecPal/.github/.github/workflows/reusable-node-build.yml@ce3a04a2cda9a704427010c0621383785b15652b
    with:
      node-version: "22"
      build-command: "npm run build"

  test:
    name: Node Tests
    uses: SecPal/.github/.github/workflows/reusable-node-test.yml@ce3a04a2cda9a704427010c0621383785b15652b
    with:
      node-version: "22"
      test-command: "npm test"
