# Dependabot Auto-Merge Workflow (secpal.app repository)
# Uses the centralized reusable workflow from .github repository
#
# For implementation details, see:
# SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml

name: Dependabot Auto-Merge

on:
  # Execute only the accepted immutable callee; never PR-controlled code.
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
      - edited
      - converted_to_draft

# Ensure only one auto-merge runs at a time per PR
concurrency:
  group: ${{ github.repository }}-dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Required permissions for dependabot auto-merge
cache-mode: none

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    # yamllint disable-line rule:line-length
    uses: SecPal/.github/.github/workflows/reusable-dependabot-auto-merge.yml@243fc1357bc1e81977839586bcff7dacb1d69d78 # v1.1.1
    secrets:
      dependabot-merger-private-key: ${{ secrets.DEPENDABOT_MERGER_PRIVATE_KEY }}
    with:
      publisher-events: ${{ vars.DEPENDABOT_MERGER_APP_ID != '' }}
      allowed-ecosystems: "github_actions,npm_and_yarn,pre_commit"
      pre-commit-path: ".pre-commit-config.yaml"
      phase: "2" # Phase 2: verified PATCH and MINOR updates
      merge-method: "squash" # Use squash merge for cleaner history
