---
# Dependabot configuration for SecPal Landing Page (Astro/Tailwind)
# Automatically creates PRs for ALL dependency updates (including Major versions)
# Security updates are prioritized and checked daily in early morning hours
version: 2
updates:
  # npm - JavaScript/TypeScript dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    versioning-strategy: "increase"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
      - "dependabot"
    rebase-strategy: "auto"

  # GitHub Actions - Workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    groups:
      shared-workflow-pins:
        patterns: ["SecPal/.github*"]
      github-actions-patch:
        patterns: ["*"]
        exclude-patterns: ["SecPal/.github*"]
        update-types: ["patch"]
      github-actions-minor:
        patterns: ["*"]
        exclude-patterns: ["SecPal/.github*"]
        update-types: ["minor"]
      github-actions-major:
        patterns: ["*"]
        exclude-patterns: ["SecPal/.github*"]
        update-types: ["major"]
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    rebase-strategy: "auto"
